name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore VRChatDiscordUploader.sln

    - name: Build solution
      run: dotnet build VRChatDiscordUploader.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test VRChatDiscordUploader.sln --configuration Release --no-build --verbosity normal

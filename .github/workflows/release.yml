name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Setup Inno Setup
      run: |
        if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

    - name: Restore dependencies
      run: dotnet restore VRChatDiscordUploader.sln

    - name: Run unit tests
      run: dotnet test VRChatDiscordUploader.sln --configuration Release --verbosity normal

    - name: Publish App (Self-Contained win-x64)
      run: |
        dotnet publish src/VRChatDiscordUploader/VRChatDiscordUploader.csproj -c Release -r win-x64 --self-contained true -o dist/app

    - name: Package Portable ZIP
      shell: pwsh
      run: |
        $ver = "${{ github.event.inputs.version }}"
        if (-not $ver) { $ver = "${{ github.ref_name }}".TrimStart('v') }
        if (-not $ver -or $ver -eq "main") { $ver = "1.0.0" }
        Compress-Archive -Path "dist/app/*" -DestinationPath "dist/VRChatDiscordUploader-v${ver}-win-x64.zip" -Force

    - name: Build Installer with Inno Setup
      shell: pwsh
      run: |
        $ver = "${{ github.event.inputs.version }}"
        if (-not $ver) { $ver = "${{ github.ref_name }}".TrimStart('v') }
        if (-not $ver -or $ver -eq "main") { $ver = "1.0.0" }
        & iscc /DMyAppVersion="$ver" installer/installer.iss

    - name: Create GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
        files: |
          dist/VRChatDiscordUploader-Setup-*.exe
          dist/VRChatDiscordUploader-v*-win-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: false
